apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-1
  # these are the labels related to deployment resource
  labels:
    app: app-1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: app-1
  template:
    metadata:
      labels:
        app: app-1
    spec:
      containers:
      - name: app-1
        image: pandu15/app1
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: app-1
  # servicer labels
  labels:
    app: app-1
spec:
# service uses the below labels to select the pods
  selector:
    app: app-1
  ports:
   - protocol: TCP
     port: 80 # service port
     targetPort: 80 # container port
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app-1
  annotations: 
  alb.ingress.kubernetes.io/scheme: internet-facing
spec:
  ingressClassName: alb
  rules:
  - host: "app1.devopswithrani.online"
    http:
      paths:
      - pathType: Prefix
        path: "/"
        backend:
          service:
            name: app-1
            port:
              number: 80
