apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  # these are the labels related to deployment resource
  labels:
    app: app-1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: app-1
  template:
    metadata:
      labels:
        app: app-1
    spec:
      containers:
      - name: app-1
        image: pandu15/app1
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: app-1
  # servicer labels
  labels:
    app: app-1
spec:
# service uses the below labels to select the pods
  selector:
    app: app-1
  ports:
   - protocol: TCP
     port: 80 # service port
     targetPort: 80 # container port

