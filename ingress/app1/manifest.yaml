apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-1
  # these are the labels related to deployment resource
  labels:
    app: app-1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: app-1
  template:
    metadata:
      labels:
        app: app-1
    spec:
      containers:
      - name: app-1
        image: pandu15/app1
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: app-1
  # servicer labels
  labels:
    app: app-1
spec:
# service uses the below labels to select the pods
  selector:
    app: app-1
  ports:
   - protocol: TCP
     port: 80 # service port
     targetPort: 80 # container port
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app-1
  annotations: 
     alb.ingress.kubernetes.io/scheme: internet-facing
     alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS": 443}]'
     alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:us-east-1:978092319764:certificate/824c2b55-8433-41aa-87be-eb4dceffb197
     alb.ingress.kubernetes.io/target-type: ip
     alb.ingress.kubernetes.io/tags: Environment=dev, Team=test
     alb.ingress.kubernetes.io/group.name: roboshop

spec:
  ingressClassName: alb
  rules:
  - host: "app1.devopswithrani.online"
    http:
      paths:
      - pathType: Prefix
        path: "/"
        backend:
          service:
            name: app-1
            port:
              number: 80
